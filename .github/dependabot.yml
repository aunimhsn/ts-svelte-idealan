# Weekly pull requests to update the npm packages and the GitHub Actions; the minor and patch
# updates of npm come grouped in one pull request. Read them with the dependency-reviewer agent.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # The types of Node.js follow the version the site runs on (.nvmrc): raise their major
      # version by hand, with .nvmrc and the engines of package.json.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
